name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests need only numpy and pandas (pinned as in requirements.txt); NFStream is stubbed.
      - run: pip install pytest $(grep -E '^(numpy|pandas)==' requirements.txt)
      - run: python -m pytest -q tests
